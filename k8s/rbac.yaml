apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-k8s-updater
  namespace: ghcr-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ghcr-k8s-updater
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghcr-k8s-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ghcr-k8s-updater
subjects:
  - kind: ServiceAccount
    name: ghcr-k8s-updater
    namespace: ghcr-updater
