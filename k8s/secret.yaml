apiVersion: v1
kind: Secret
metadata:
  name: ghcr-updater-secret
  namespace: ghcr-updater
type: Opaque
stringData:
  GHCR_USERNAME: "eNesPL"
  # Wstaw swój GitHub Personal Access Token (classic) z uprawnieniem `read:packages`
  # Jeśli Twoje Pody mają przypięte `imagePullSecrets`, updater potrafi też odczytać token automatycznie z nich.
  GHCR_TOKEN: "ghp_REPLACE_WITH_YOUR_READ_PACKAGES_PAT"
  # Opcjonalny Discord / Slack Webhook URL do powiadomień o restartach
  WEBHOOK_URL: ""
